name: Generate Animations (Snake & Pacman)

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Create dist folder
      - name: Create dist directory
        run: mkdir -p dist

      # Step 2: Generate Snake Animation 🐍
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: harishnirmalkar2128-hub
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 3: Generate Pac-Man Animation 👾
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: harishnirmalkar2128-hub
          theme: dark

      # Step 4: Move Pac-Man outputs into dist folder 🚚
      - name: Move Pacman files to dist
        run: |
          mv pacman-contribution-graph*.svg dist/ 2>/dev/null || true

      # Step 5: Push both to the output branch 📤
      - name: push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
