name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"   # Runs every 12 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Pac-Man Graph
        uses: Platane/snk@v3
        with:
          github_user_name: harishnirmalkar2128-hub
          outputs: |
            output/pacman-contribution-graph-dark.svg?palette=github-dark
            output/pacman-contribution-graph.svg?palette=github-light

      - name: Push generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
